[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-docs-mcp"
version = "0.1.0"
description = "MCP RAG server for OpenClaw documentation (FastMCP + PostgreSQL + pgvector)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "miguelcc06" }]
dependencies = [
    "fastmcp>=2.0",
    "markitdown[all]>=0.1.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "openai>=1.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
openclaw-docs-mcp = "openclaw_docs_mcp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
